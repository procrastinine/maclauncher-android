# Android password-based algorithms use the supplied Android BC implementation.
# Other algorithms retain the selected JDK's provider preferences and order.
jdk.security.provider.preferred=Cipher.PBEWithMD5AndDES:BC,SecretKeyFactory.PBEWithMD5AndDES:BC,Cipher.PBEWithSHA1AndDESede:BC,SecretKeyFactory.PBEWithSHA1AndDESede:BC,Mac.PBEWithHmacSHA1:BC
